name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:database
      - run: npm run test:ssh
      - run: npm run test:vpn
      - run: npm run test:template
      - run: npm run build
      # electron-builder uploads each artifact through its own "create the
      # release if it is missing" call. Those calls can land in the same second
      # and produce two releases on one tag, splitting the assets between them
      # (2.0.1 shipped the installer on one and the blockmap on the other).
      # Creating the release up front means every upload finds it already there.
      - name: Reserve a single release for this tag
        shell: bash
        run: |
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")
          for id in $ids; do
            echo "removing pre-existing release $id for ${GITHUB_REF_NAME}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "HyperFamily Branch Monitor ${GITHUB_REF_NAME#v}" \
            --target "${GITHUB_SHA}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The recovery tool is embedded in the installer via extraFiles, so it
      # must exist before the main build starts.
      - name: Build the credential recovery tool
        run: |
          npm --prefix electron/recovery install
          npx electron-builder --config electron-builder.recovery.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build and publish GitHub release
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure CSC_LINK and CSC_KEY_PASSWORD as repository secrets before production use.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Attach the standalone recovery tool to the release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "recovery-dist/HyperFamily-Credential-Recovery.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder creates the GitHub release as a draft by default, and a
      # draft is invisible to electron-updater. Force it public so the in-app
      # updater can see this version and download the installer.
      - name: Publish the release so the in-app updater can see it
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if the tag ended up with more than one release
        shell: bash
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")] | length")
          echo "releases on ${GITHUB_REF_NAME}: ${count}"
          [ "$count" = "1" ] || { echo "::error::${count} releases share this tag; the updater would read the wrong one"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the installer is attached
        shell: bash
        run: |
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.exe$'   || { echo "::error::no .exe asset on the release"; exit 1; }
          echo "$assets" | grep -q '^latest\.yml$' || { echo "::error::latest.yml missing, the updater cannot detect this release"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
