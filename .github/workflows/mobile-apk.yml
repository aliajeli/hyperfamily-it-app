# Build the Android companion APK and attach it to the release, so phones can
# self-update from GitHub Releases like the desktop app does.
#
# Called as a reusable workflow by the release workflows once the release is
# published (token-created releases fire no `release` events, dispatching
# needs the file on the default branch, and `workflow_run` would too — a
# same-ref `uses:` call has neither limitation).
#
# Signing: repository secrets HF_KEYSTORE_BASE64 (base64 of the keystore
# file), HF_KEYSTORE_PASSWORD, HF_KEY_ALIAS, HF_KEY_PASSWORD. Without them the
# build still runs but the APK goes out -unsigned and cannot update previous
# installs.
name: Mobile APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the APK to this release tag (empty = build artifact only)'
        required: false
        default: ''
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # steps.if cannot read the secrets context, so gate on this instead.
      HAS_KEYSTORE: ${{ secrets.HF_KEYSTORE_BASE64 != '' }}
      HF_KEYSTORE_PASSWORD: ${{ secrets.HF_KEYSTORE_PASSWORD }}
      HF_KEY_ALIAS: ${{ secrets.HF_KEY_ALIAS }}
      HF_KEY_PASSWORD: ${{ secrets.HF_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No setup-android needed: ubuntu runners ship the SDK (ANDROID_HOME is
      # preset) with platforms;android-35 and build-tools;35.

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: Sync Capacitor
        run: cd mobile && npx cap sync android

      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.HF_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > /tmp/hf-companion.keystore

      - name: Build release APK
        env:
          HF_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && '/tmp/hf-companion.keystore' || '' }}
        run: cd mobile/android && ./gradlew assembleRelease --no-daemon --console=plain

      - name: Stage APK
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            cp "$APK" "HyperFamily-Companion-$VERSION.apk"
          else
            APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            cp "$APK" "HyperFamily-Companion-$VERSION-unsigned.apk"
            echo "::warning::No signing secrets configured - uploaded an unsigned APK."
          fi
          ls -la HyperFamily-Companion-*.apk

      - name: Attach APK to release
        if: ${{ github.event_name == 'workflow_call' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.release_tag }}'
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          gh release upload "$TAG" HyperFamily-Companion-*.apk --clobber

      - name: Upload build artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: HyperFamily-Companion-*.apk
