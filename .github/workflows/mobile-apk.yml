# Build the Android companion APK and attach it to the published release,
# so phones can self-update from GitHub Releases like the desktop app does.
#
# Signing: set repository secrets HF_KEYSTORE_BASE64 (base64 of the keystore
# file), HF_KEYSTORE_PASSWORD, HF_KEY_ALIAS, HF_KEY_PASSWORD. Without them the
# workflow still builds, but uploads an -unsigned APK that cannot update
# previous installs.
name: Mobile APK

on:
  # Releases are created by the release workflows with GITHUB_TOKEN, and
  # token-created releases do not fire `release` events for other workflows —
  # so hook onto the completion of those workflows instead.
  workflow_run:
    workflows: ['Beta Release', 'Release']
    types: [completed]
  workflow_dispatch:

jobs:
  apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # steps.if cannot read the secrets context, so gate on this instead.
      HAS_KEYSTORE: ${{ secrets.HF_KEYSTORE_BASE64 != '' }}
      HF_KEYSTORE_PASSWORD: ${{ secrets.HF_KEYSTORE_PASSWORD }}
      HF_KEY_ALIAS: ${{ secrets.HF_KEY_ALIAS }}
      HF_KEY_PASSWORD: ${{ secrets.HF_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No setup-android needed: ubuntu runners ship the SDK (ANDROID_HOME is
      # preset) with platforms;android-35 and build-tools;35.

      - name: Install dependencies
        run: cd mobile && npm ci

      - name: Sync Capacitor
        run: cd mobile && npx cap sync android

      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.HF_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > /tmp/hf-companion.keystore

      - name: Build release APK
        env:
          HF_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && '/tmp/hf-companion.keystore' || '' }}
        run: cd mobile/android && ./gradlew assembleRelease --no-daemon --console=plain

      - name: Stage APK
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            cp "$APK" "HyperFamily-Companion-$VERSION.apk"
          else
            APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            cp "$APK" "HyperFamily-Companion-$VERSION-unsigned.apk"
            echo "::warning::No signing secrets configured - uploaded an unsigned APK."
          fi
          ls -la HyperFamily-Companion-*.apk

      - name: Attach APK to release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --json tagName --jq .tagName)
          gh release upload "$TAG" HyperFamily-Companion-*.apk --clobber

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: HyperFamily-Companion-*.apk
