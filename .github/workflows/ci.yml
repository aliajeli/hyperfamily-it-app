name: CI

on:
  push:
    branches: [main, Update, Beta]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      # CMake discovers the runner's Visual Studio C++ tools; no .NET SDK needed.
      - run: npm run build:agent
      - name: Test the real Windows Agent service
        run: npm run test:agent
        env:
          HF_AGENT_WINDOWS_TEST: '1'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:database
      - run: npm run test:ssh
      - run: npm run test:vpn
      - run: npm run test:template
      - run: npm run build
      - name: Build the credential recovery tool
        if: github.event_name == 'push'
        run: |
          npm --prefix electron/recovery install
          npx electron-builder --config electron-builder.recovery.json --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package unsigned test installer
        if: github.event_name == 'push'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: windows-installer-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
