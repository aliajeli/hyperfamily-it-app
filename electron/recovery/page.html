<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperFamily Credential Recovery</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #eef1f6; color: #222a35;
    padding: 20px 18px; min-height: 100vh; display: flex; flex-direction: column; }
  h1 { font-size: 15px; }
  p.sub { font-size: 11px; color: #66707f; margin: 3px 0 14px; }
  .box { background: #ffffff; border: 1px solid #dbe1ea; border-radius: 10px; padding: 12px 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #ffffff; border: 1px solid #dbe1ea; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #77828f; }
  .v { font-family: Consolas, monospace; font-size: 14px; word-break: break-all; margin-top: 2px; }
  .v.hint { color: #98a1af; font-family: inherit; font-size: 11px; }
  input { width: 100%; border: 1px solid #c9d2dd; border-radius: 8px; padding: 9px 12px;
    font-size: 15px; letter-spacing: .35em; text-align: center; outline: none; }
  input:focus { border-color: #3b6fd4; box-shadow: 0 0 0 3px rgba(59,111,212,.15); }
  button { background: #3b6fd4; border: 0; color: #fff; font-weight: 700; font-size: 11px;
    padding: 8px 16px; border-radius: 7px; cursor: pointer; flex-shrink: 0; }
  button:hover { filter: brightness(1.08); }
  button:disabled { background: #a9b6c8; cursor: default; filter: none; }
  button.copied { background: #2e9e5b; }
  .btn-main { width: 100%; margin-top: 10px; font-size: 12.5px; padding: 10px; }
  .msg { font-size: 11px; line-height: 1.55; margin-top: 10px; color: #8c2f2f; }
  .msg.ok { color: #2e9e5b; }
  .msg.info { color: #66707f; }
  .attempts { font-size: 10.5px; color: #8a94a3; margin-top: 8px; }
  .error { background: #fdecec; border: 1px solid #f0c2c2; border-radius: 10px; padding: 14px;
    font-size: 12px; line-height: 1.6; color: #8c2f2f; }
  footer { margin-top: auto; font-size: 10px; color: #8a94a3; text-align: center; padding-top: 10px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>HyperFamily Credential Recovery</h1>
  <p class="sub">The administrator login saved on this computer</p>

  <div id="error" class="error hidden"></div>

  <div id="pinView">
    <div class="box">
      <div class="k">Recovery PIN</div>
      <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" aria-label="Recovery PIN">
      <button id="submit" class="btn-main">Reveal credentials</button>
      <p id="msg" class="msg hidden"></p>
      <p id="attempts" class="attempts"></p>
    </div>
  </div>

  <div id="resultView" class="hidden">
    <div class="row">
      <div>
        <div class="k">Username</div>
        <div class="v" id="resUser"></div>
      </div>
      <button data-copy="user">Copy</button>
    </div>
    <div class="row">
      <div>
        <div class="k">Password</div>
        <div class="v" id="resPass"></div>
      </div>
      <button data-copy="pass">Copy</button>
    </div>
    <p class="msg info">Keep these safe — anyone with them can open the application.</p>
  </div>

  <footer>Works only for the Windows user who runs the application.</footer>

  <script>
    var state = null
    var locked = false
    var retryAfterMs = 0
    var attemptsLeft = 0

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }

    function setText(id, text) {
      var el = document.getElementById(id)
      el.textContent = text
      el.classList.remove('hidden')
    }

    function showMessage(text, cls) {
      var el = document.getElementById('msg')
      el.textContent = text
      el.className = 'msg ' + (cls || '')
      el.classList.remove('hidden')
    }

    function tick() {
      if (!locked) return
      retryAfterMs -= 1000
      if (retryAfterMs <= 0) {
        locked = false
        attemptsLeft = 5
        document.getElementById('pin').disabled = false
        document.getElementById('submit').disabled = false
        document.getElementById('msg').classList.add('hidden')
        document.getElementById('attempts').textContent = ''
        return
      }
      var total = Math.ceil(retryAfterMs / 1000)
      var m = Math.floor(total / 60)
      var s = String(total % 60).padStart(2, '0')
      showMessage('Too many wrong attempts — recovery is locked. Try again in ' + m + ':' + s + '.', '')
    }

    function renderAttempts() {
      document.getElementById('attempts').textContent = locked
        ? ''
        : (attemptsLeft + ' attempt' + (attemptsLeft === 1 ? '' : 's') + ' remaining before a 5-minute lock.')
    }

    window.recovery.state().then(function (s) {
      state = s
      if (s.error) { setText('error', s.error); return }
      if (!s.pinSet) {
        setText('error', 'No recovery PIN has been set. Sign in to the application and set one in Settings → General, then run this tool again.')
        document.getElementById('pinView').classList.add('hidden')
        return
      }
      if (s.locked) {
        locked = true
        retryAfterMs = s.retryAfterMs
        document.getElementById('pin').disabled = true
        document.getElementById('submit').disabled = true
        tick()
        setInterval(tick, 1000)
      } else {
        attemptsLeft = s.attemptsLeft
        renderAttempts()
      }
    })

    document.getElementById('submit').addEventListener('click', function () {
      var pin = document.getElementById('pin').value
      if (!pin || locked) return
      this.disabled = true
      window.recovery.verify(pin).then(function (r) {
        document.getElementById('submit').disabled = locked
        if (r.ok) {
          document.getElementById('pinView').classList.add('hidden')
          document.getElementById('resultView').classList.remove('hidden')
          document.getElementById('resUser').textContent = r.username
          document.getElementById('resPass').textContent = r.password || 'not recorded'
          if (!r.password) document.getElementById('resPass').className = 'v hint'
          return
        }
        if (r.error) { showMessage(r.error, ''); return }
        if (r.locked) {
          locked = true
          retryAfterMs = r.retryAfterMs
          document.getElementById('pin').disabled = true
          tick()
          setInterval(tick, 1000)
          renderAttempts()
          return
        }
        attemptsLeft = r.attemptsLeft
        showMessage('Wrong PIN.', '')
        renderAttempts()
        document.getElementById('pin').value = ''
        document.getElementById('pin').focus()
      })
    })

    document.getElementById('pin').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '')
    })
    document.getElementById('pin').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('submit').click()
    })

    document.querySelectorAll('[data-copy]').forEach(function (button) {
      button.addEventListener('click', function () {
        var value = this.getAttribute('data-copy') === 'user'
          ? document.getElementById('resUser').textContent
          : document.getElementById('resPass').textContent
        navigator.clipboard.writeText(value).then(function () {
          var old = button.textContent
          button.textContent = 'Copied'
          button.classList.add('copied')
          setTimeout(function () { button.textContent = old; button.classList.remove('copied') }, 1400)
        })
      })
    })
  </script>
</body>
</html>
