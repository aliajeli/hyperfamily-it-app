<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remote session</title>
<style>
  :root {
    --canvas: 46 52 64;
    --surface: 59 66 82;
    --border: 76 86 106;
    --text: 236 239 244;
    --muted: 216 222 233;
    --primary: 136 192 208;
    --danger: 191 97 106;
    --success: 163 190 140;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: rgb(var(--canvas)); color: rgb(var(--text));
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif; overflow: hidden; }
  #shell { display: flex; flex-direction: column; height: 100%; }

  header {
    -webkit-app-region: drag; display: flex; align-items: center; gap: 12px;
    height: 46px; padding: 0 10px 0 14px; flex: none;
    background: linear-gradient(180deg, rgb(var(--surface)) 0%, rgba(var(--surface), .92) 100%);
    border-bottom: 1px solid rgba(var(--border), .85);
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: rgb(var(--success));
    box-shadow: 0 0 0 4px rgba(163, 190, 140, .18); flex: none; }
  .dot.off { background: rgb(var(--danger)); box-shadow: 0 0 0 4px rgba(191, 97, 106, .18); }
  .identity { display: flex; flex-direction: column; min-width: 0; }
  .identity strong { font-size: 12.5px; font-weight: 600; line-height: 1.25; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .identity span { font-size: 11px; color: rgba(var(--muted), .75); line-height: 1.25; }
  .chip { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(var(--primary), .45);
    color: rgb(var(--primary)); background: rgba(var(--primary), .12); flex: none; }
  .spacer { flex: 1; }
  .actions { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 6px; }
  button {
    -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 11px; border-radius: 8px; cursor: pointer;
    font-size: 12px; font-weight: 500; font-family: inherit;
    color: rgb(var(--text)); background: rgba(var(--canvas), .55);
    border: 1px solid rgba(var(--border), .9); transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: rgba(var(--primary), .16); border-color: rgba(var(--primary), .5); }
  button:active { transform: translateY(1px); }
  button.primary { background: rgba(var(--primary), .18); border-color: rgba(var(--primary), .55);
    color: rgb(var(--primary)); }
  button.danger { color: rgb(var(--danger)); border-color: rgba(191, 97, 106, .5); }
  button.danger:hover { background: rgba(191, 97, 106, .18); border-color: rgb(var(--danger)); }
  button svg { width: 14px; height: 14px; }

  #stage { position: relative; flex: 1; min-height: 0; background: rgb(var(--canvas)); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; gap: 14px;
    background: rgb(var(--canvas)); transition: opacity .35s ease; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ring { width: 42px; height: 42px; border-radius: 999px;
    border: 3px solid rgba(var(--border), .8); border-top-color: rgb(var(--primary));
    animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { margin: 0; font-size: 12.5px; color: rgba(var(--muted), .8); }

  #transfer { position: absolute; right: 16px; bottom: 16px; width: 268px; padding: 14px;
    border-radius: 12px; background: rgba(var(--surface), .97);
    border: 1px solid rgba(var(--border), .9); box-shadow: 0 18px 50px rgba(0,0,0,.38);
    display: none; }
  #transfer.open { display: block; }
  #transfer h3 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; }
  #transfer p { margin: 0 0 10px; font-size: 11px; line-height: 1.5; color: rgba(var(--muted), .75); }
  #drop { border: 1.5px dashed rgba(var(--primary), .5); border-radius: 10px; padding: 18px 10px;
    text-align: center; font-size: 11.5px; color: rgba(var(--muted), .85);
    background: rgba(var(--primary), .07); transition: background .15s, border-color .15s; }
  #drop.hot { background: rgba(var(--primary), .18); border-color: rgb(var(--primary)); }
  footer { flex: none; height: 24px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    font-size: 10.5px; color: rgba(var(--muted), .6);
    background: rgba(var(--surface), .55); border-top: 1px solid rgba(var(--border), .6); }
</style>
</head>
<body>
<div id="shell">
  <header>
    <span class="dot" id="state-dot"></span>
    <span class="identity"><strong id="device-name">Remote session</strong><span id="device-meta"></span></span>
    <span class="chip" id="protocol-chip">RDP</span>
    <span class="spacer"></span>
    <div class="actions">
      <button id="btn-transfer" title="Copy files to the remote machine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Files
      </button>
      <button id="btn-reload" title="Reconnect the session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Reconnect
      </button>
      <button id="btn-fullscreen" title="Toggle full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button id="btn-close" class="danger" title="End the session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Disconnect
      </button>
    </div>
  </header>

  <div id="stage">
    <iframe id="frame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
    <div id="overlay">
      <div class="loader">
        <div class="ring"></div>
        <p id="overlay-text">Negotiating the remote session…</p>
      </div>
    </div>
    <section id="transfer">
      <h3>File transfer</h3>
      <p id="transfer-hint">Files dropped here are copied to the shared drive that is mounted on the remote machine as <b>HyperFamily Transfer</b>.</p>
      <div id="drop">Drop files here, or click to browse</div>
    </section>
  </div>

  <footer><span id="status-text">Connecting…</span><span class="spacer"></span><span id="server-text"></span></footer>
</div>

<script>
  const api = window.remoteViewer
  const params = api ? api.session : {}

  const setText = (id, value) => { document.getElementById(id).textContent = value }

  if (params.palette) {
    Object.entries(params.palette).forEach(([key, value]) => {
      document.documentElement.style.setProperty('--' + key, value)
    })
  }

  setText('device-name', params.device?.name || 'Remote session')
  setText('device-meta', [params.device?.ip, params.credential?.username].filter(Boolean).join('  •  '))
  setText('protocol-chip', (params.protocol || 'rdp').toUpperCase())
  setText('server-text', params.origin || '')

  const frame = document.getElementById('frame')
  const overlay = document.getElementById('overlay')
  const dot = document.getElementById('state-dot')

  function load() {
    overlay.classList.remove('hidden')
    setText('overlay-text', 'Negotiating the remote session…')
    setText('status-text', 'Connecting…')
    dot.classList.add('off')
    frame.src = params.url
  }

  frame.addEventListener('load', () => {
    setTimeout(() => {
      overlay.classList.add('hidden')
      dot.classList.remove('off')
      setText('status-text', 'Connected — ' + (params.protocol || 'rdp').toUpperCase() + ' via Apache Guacamole')
    }, 700)
  })

  document.getElementById('btn-reload').addEventListener('click', load)
  document.getElementById('btn-close').addEventListener('click', () => api?.close())
  document.getElementById('btn-fullscreen').addEventListener('click', () => api?.toggleFullScreen())

  const transfer = document.getElementById('transfer')
  document.getElementById('btn-transfer').addEventListener('click', () => transfer.classList.toggle('open'))

  if (!params.fileTransfer) {
    setText('transfer-hint', 'File transfer needs the Guacamole shared drive enabled for this protocol. Turn it on in Settings → Remote.')
    document.getElementById('drop').textContent = 'Shared drive disabled'
  }

  const drop = document.getElementById('drop')
  drop.addEventListener('click', async () => {
    const result = await api?.pickFiles()
    if (result?.count) drop.textContent = result.count + ' file(s) staged in the shared drive'
  })
  ;['dragenter', 'dragover'].forEach((type) => drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add('hot') }))
  ;['dragleave', 'drop'].forEach((type) => drop.addEventListener(type, () => drop.classList.remove('hot')))
  drop.addEventListener('drop', async (event) => {
    event.preventDefault()
    const paths = [...event.dataTransfer.files].map((file) => api?.pathFor(file)).filter(Boolean)
    if (!paths.length) return
    const result = await api?.stageFiles(paths)
    drop.textContent = result?.count ? result.count + ' file(s) copied to the shared drive' : 'Copy failed'
  })

  load()
</script>
</body>
</html>
