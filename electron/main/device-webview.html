<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src *; child-src *; connect-src 'self'" />
<title>Device</title>
<style>
  :root {
    --canvas: 17 19 24; --surface: 24 27 34; --border: 44 48 58;
    --text: 233 236 242; --muted: 141 148 163; --primary: 96 165 250;
    --danger: 248 113 113; --success: 74 222 128;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: rgb(var(--canvas)); color: rgb(var(--text));
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    transition: background .25s ease, color .25s ease;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
    height: 46px; padding: 0 10px;
    background: rgb(var(--surface));
    border-bottom: 1px solid rgb(var(--border));
    -webkit-app-region: drag;
  }
  header button, header .url { -webkit-app-region: no-drag; }
  .dot { width: 9px; height: 9px; border-radius: 999px; background: rgb(var(--muted)); flex: 0 0 auto; transition: background .2s ease; }
  .dot.busy { background: rgb(var(--primary)); animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok { background: rgb(var(--success)); }
  .dot.err { background: rgb(var(--danger)); }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .title { font-size: 12.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
  .url {
    flex: 1 1 auto; min-width: 0; font-size: 11.5px; color: rgb(var(--muted));
    background: rgb(var(--canvas)); border: 1px solid rgb(var(--border)); border-radius: 8px;
    padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
    font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    color: rgb(var(--text)); background: rgb(var(--canvas));
    border: 1px solid rgb(var(--border)); border-radius: 8px;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover { border-color: rgb(var(--primary)); color: rgb(var(--primary)); }
  button.accent { background: rgb(var(--primary) / .14); border-color: rgb(var(--primary) / .45); color: rgb(var(--primary)); }
  button.danger:hover { border-color: rgb(var(--danger)); color: rgb(var(--danger)); }
  main { position: relative; flex: 1 1 auto; min-height: 0; background: rgb(var(--canvas)); }
  webview { width: 100%; height: 100%; border: 0; display: flex; background: #fff; }
  .status {
    position: absolute; inset: auto 0 0 0; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; font-size: 11px; font-weight: 600;
    background: rgb(var(--surface)); border-top: 1px solid rgb(var(--border)); color: rgb(var(--muted));
  }
  .status.error { color: rgb(var(--danger)); }
  .status.done { color: rgb(var(--success)); }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: rgb(var(--canvas)); z-index: 5;
    transition: opacity .3s ease;
  }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .spinner {
    width: 30px; height: 30px; border-radius: 999px;
    border: 2.5px solid rgb(var(--border)); border-top-color: rgb(var(--primary));
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .overlay p { margin: 0; font-size: 12px; color: rgb(var(--muted)); }
</style>
</head>
<body>
  <header>
    <span class="dot busy" id="dot"></span>
    <span class="title" id="title">Device</span>
    <span class="url" id="url"></span>
    <button id="back" title="Back">&#8592;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <button id="login" class="accent" title="Re-run the automatic sign-in">Auto sign-in</button>
    <button id="close" class="danger">Close</button>
  </header>
  <main>
    <div class="overlay" id="overlay"><div class="spinner"></div><p id="overlay-text">Connecting to the device&hellip;</p></div>
    <div class="status" id="status">Waiting for the device&hellip;</div>
  </main>
  <script src="./device-webview-renderer.js"></script>
</body>
</html>
